name: CI

on:
  push:
    branches: [main, master, "release/**"]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write   # needed by review-agent to post comments

jobs:
  lint:
    # Gating — pre-existing style issues were cleared on 2026-09-01
    # (419 → 0 via ruff --fix + manual cleanup; see PR commit history).
    # Any new ruff violation will fail this job and block merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install ruff
        run: python -m pip install --upgrade pip && pip install "ruff==0.6.9"
      - name: Ruff check
        run: ruff check pyduck_janitor scripts tests
      - name: Ruff format check
        run: ruff format --check pyduck_janitor scripts tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install
        # Pin DuckDB and pandas to known-good versions to catch upstream
        # breakages early. If a pinned run passes, the float range in
        # pyproject.toml is safe.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "duckdb==1.5.2" "pandas==2.1.4"
      - name: Test
        # -x = stop on first failure (faster feedback for agents)
        # -v  = verbose so an agent can map failures back to specific tests
        # --tb=long = full traceback uploaded as artifact for self-debugging
        run: |
          mkdir -p artifacts
          pytest -x -v --tb=long --color=yes 2>&1 | tee artifacts/pytest.log
      - name: Upload pytest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.python-version }}
          path: artifacts/pytest.log
          if-no-files-found: error

  review-agent:
    # Only run on PRs. Posts a structured comment with module map,
    # API surface diff, and docstring coverage. This is the primary
    # affordance that lets an AI agent (or any contributor) orient
    # to the codebase without reading every file.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need full history for git diff against base
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run review script
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/ci_review.py

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v'))
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build --sdist --wheel
      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
