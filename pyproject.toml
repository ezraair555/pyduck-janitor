[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyduck-janitor"
version = "0.2.7"
description = "DuckDB-backed pyjanitor for high-performance data cleaning, text search, and vector similarity on large datasets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "EzraAir555", email = "ezraair555@gmail.com"}
]
keywords = ["duckdb", "janitor", "data cleaning", "pandas", "data preprocessing", "etl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "duckdb>=1.5.5,<1.6",
    "pandas>=1.5.0",
    "numpy>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=3.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
    "mypy>=0.950",
    "ruff>=0.6.0",
    "openpyxl>=3.1",
    "pyarrow>=15.0",
]
io = [
    "openpyxl>=3.1",
    "pyarrow>=15.0",
]
vss = [
    "sentence-transformers>=2.2",
    "huggingface_hub>=0.20",
]
embeddings = [
    # Bundled weights via the companion wheel (offline install path).
    "pyduck-janitor-embeddings>=0.1",
    "sentence-transformers>=2.2",
    "huggingface_hub>=0.20",
]
graph = [
    # Onager is installed at runtime from DuckDB's community repository.
    "duckdb>=1.5.5,<1.6",
]
diff = [
    # duck_diff is installed at runtime from DuckDB's community repository.
    "duckdb>=1.5.5,<1.6",
]
text = [
    # icu + fts ship with the DuckDB Python wheel; this extra is a
    # no-op placeholder kept for install-command stability.
]

[project.urls]
Homepage = "https://github.com/ezraair555/pyduck-janitor"
Documentation = "https://github.com/ezraair555/pyduck-janitor/tree/main/docs"
Repository = "https://github.com/ezraair555/pyduck-janitor"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyduck_janitor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# N818 would break the public
# exception names; SIM108 is a readability preference, not a correctness rule.
ignore = ["N818", "SIM108", "UP007"]
